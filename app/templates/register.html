{% extends "base.html" %}{% block title %}Create account · Stitch It{% endblock %}{% block content %}
<section class="auth"><span class="eyebrow">JOIN THE ECOSYSTEM</span><h1>Make room for<br><em>the perfect fit.</em></h1>
  <form method="post" action="/register" class="panel">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>Full name<input name="name" required minlength="2" maxlength="120" autocomplete="name"></label>
    <label>Email<input type="email" name="email" required autocomplete="email"></label>
    <label>Phone <small>(optional)</small><input name="phone" maxlength="30" autocomplete="tel"></label>
    <label>Account type<select name="role" required><option value="customer">Customer</option><option value="tailor">Tailor</option><option value="delivery">Delivery partner</option></select></label>
    <label>Password <small>(8–256 characters)</small><input type="password" name="password" required minlength="8" maxlength="256" autocomplete="new-password"></label>
    <button class="btn full">Create account</button>
    <p class="muted">Already registered? <a href="/login">Sign in</a></p>
  </form>
</section>{% endblock %}
